[package]
name = "sortsize-owner-resolution"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
description = "Résolution Owner explicite et bornée, indépendante du scanner SortSize"

[dependencies]
sortsize-core = { path = "../sortsize-core" }

[target.'cfg(target_os = "linux")'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_Security"] }

[dev-dependencies]
tempfile.workspace = true
serde_json.workspace = true

[target.'cfg(windows)'.dev-dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_System_Threading", "Win32_Security_Authentication_Identity"] }

[features]
# Validation harness only; no allocator counters in ordinary builds.
owner-heap-profile = []
