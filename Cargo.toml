[workspace]
members = ["crates/sortsize-core", "apps/sortsize-cli"]
exclude = ["spikes/slint"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
publish = false

[workspace.dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
globset = "0.4"
clap = { version = "4.5", features = ["derive"] }
ctrlc = "3.4"
tempfile = "3.20"
